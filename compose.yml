services:
  bind001:
    image: cloud/bind:1
    ports:
      - target: 53
        published: 53
        protocol: tcp
        mode: host
      - target: 53
        published: 53
        protocol: udp
        mode: host
    volumes:
      - /mnt/secrets/bind:/home/user/secrets:ro
    tmpfs:
      - /mnt
    networks:
      - hlc
    deploy:
      placement:
        constraints:
          - node.hostname == prd-hs-host001.hlc.homelab6.com
      restart_policy:
        condition: any

networks:
  hlc:
    external: true
